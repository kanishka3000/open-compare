<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Simplified cut used for the 16/32/64px icns slices: fewer, heavier rows and
       no shadows, so the shape survives being rasterised down to a few pixels. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#plate)"/>

  <rect x="172" y="252" width="320" height="520" rx="40" fill="#FBFCFE"/>
  <rect x="216" y="308" width="232" height="88" rx="44" fill="#BAC4D8"/>
  <rect x="216" y="468" width="232" height="88" rx="44" fill="#EF4444"/>
  <rect x="216" y="628" width="232" height="88" rx="44" fill="#BAC4D8"/>

  <rect x="532" y="252" width="320" height="520" rx="40" fill="#FBFCFE"/>
  <rect x="576" y="308" width="232" height="88" rx="44" fill="#BAC4D8"/>
  <rect x="576" y="468" width="232" height="88" rx="44" fill="#22C55E"/>
  <rect x="576" y="628" width="232" height="88" rx="44" fill="#BAC4D8"/>
</svg>
